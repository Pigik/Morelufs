# Локальный запуск на ПК: docker compose -f docker-compose.yml -f compose.local.yml up --build
# Сайт: http://localhost:8080. Вход через Telegram локально работает, только если в .env
# WEBAPP_URL=http://localhost:8080/ и этот адрес добавлен в Allowed URLs у @BotFather.
services:
  app:
    ports:
      - "127.0.0.1:8080:8080"
