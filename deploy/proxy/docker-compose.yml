# Сервер: /root/proxy. Общий вход 80/443 для всех сайтов на VDS: Caddy сам выпускает
# и продлевает сертификаты Let's Encrypt. Сайты подключаются к сети proxy.
name: proxy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy]
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    name: proxy
